# 관심 주제·검색어·분류·추천 가중치.
# 사용자의 피드백에 따라 이 파일만 고쳐도 검색과 추천이 바뀌도록 단순하게 유지한다.

# 수집 시 실행할 검색. lang 은 Google 뉴스 판(ko/en/ar)을 고른다.
# topic 이 있으면 관심 주제 전용 검색이다(전체 추천에서 밀려도 해당 탭에서 볼 수 있다).
searches:
  - {topic: bismayah, lang: ko, q: '비스마야 OR "비스마야 신도시" OR "한화 이라크"'}
  - {topic: bismayah, lang: en, q: 'Bismayah OR Bismaya OR "Hanwha" Iraq'}
  - {topic: bismayah, lang: en, q: '"National Investment Commission" Iraq'}
  - {topic: bismayah, lang: ar, q: 'بسماية OR هانوا OR "الهيئة الوطنية للاستثمار"'}
  - {topic: cabinet, lang: en, q: 'Iraq "Council of Ministers" OR "Iraqi cabinet"'}
  - {topic: cabinet, lang: ar, q: '"مجلس الوزراء العراقي" OR "جلسة مجلس الوزراء" العراق'}
  - {topic: cabinet, lang: ko, q: '이라크 내각 OR "이라크 총리" OR "이라크 정부"'}
  - {topic: korea_media, lang: ko, q: '비스마야 OR "한화 건설부문" 이라크 OR "한화 이라크"'}
  - {lang: ko, q: '이라크'}
  - {lang: en, q: 'Iraq security OR attack OR drone OR militia'}
  - {lang: en, q: 'Iraq oil OR budget OR economy'}
  - {lang: ar, q: 'العراق أمن OR هجوم OR انفجار'}
  - {lang: en, q: 'Iran "United States" OR Israel OR Hormuz'}
  - {lang: ko, q: '이란 미국 OR 호르무즈 OR 중동 정세'}
  # 아래는 실제 보고서 항목과 대조해 추가한 검색 (IS 작전, 무장단체, KRG, 美-이란, 유가)
  - {lang: en, q: 'Iraq ISIS OR Daesh operation OR airstrike OR hideout Kirkuk OR Diyala OR Anbar OR Nineveh'}
  - {lang: ar, q: 'داعش كركوك OR ديالى OR الأنبار OR نينوى عملية OR ضربة OR مضافة'}
  - {lang: ar, q: '"خلية الإعلام الأمني"'}
  - {lang: en, q: 'Iraq militia weapons OR disarm OR "Kataib Hezbollah" OR "Coordination Framework"'}
  - {lang: ar, q: 'العراق "حصر السلاح" OR الفصائل OR "الإطار التنسيقي"'}
  - {lang: en, q: 'Kurdistan Baghdad budget OR salaries OR oil OR Barzani'}
  - {lang: en, q: 'Iran Vance OR Rubio OR nuclear OR uranium OR ceasefire OR strike'}
  - {lang: ko, q: '이란 핵 OR 종전 OR 트럼프 OR 공습'}
  - {lang: en, q: 'Iraq prime minister Al-Zaidi'}
  - {lang: ar, q: 'رئيس الوزراء العراقي الزيدي'}
  - {lang: en, q: '"Central Bank of Iraq" OR "Iraqi dinar" OR "Iraq reserves"'}
  - {lang: ar, q: 'العراق "المنطقة الخضراء" OR السفارة OR تظاهرات OR مسيرة'}
  - {lang: en, q: 'Iraq Saudi OR Jordan OR Turkey OR Kuwait OR Syria talks OR visit OR border'}
  # 아래는 주간 보고서 6주치·일일 보고서 12건에서 반복해 실린 사안의 검색
  - {lang: en, q: 'Iraq housing OR "land plots" OR mortgage OR Rafidain OR "New Sadr City"'}
  - {lang: ar, q: 'العراق الإسكان OR "قطع أراضي" OR "القروض السكنية" OR "مصرف الرافدين"'}
  - {lang: en, q: 'Iraq parliament vote OR ministers OR "deputy prime minister" OR "Coordination Framework"'}
  - {lang: en, q: 'Iraq "exchange rate" OR dinar OR "World Bank" OR IMF OR budget'}
  - {lang: en, q: 'Iraq corruption court OR sentenced OR smuggling arrested'}
  - {lang: en, q: 'US Treasury OR "State Department" Iraq sanctions OR militias OR waiver'}
  - {lang: en, q: 'Houthi Saudi OR Aramco OR Yemen OR Sanaa'}
  - {lang: ko, q: '후티 사우디 OR 예멘 OR 아람코'}
  # 아래는 사용자 지적으로 보강한 검색: 정치권(정당·연합) 동향, 총리 동향, 건설주택부·부동산 정책
  - {lang: ar, q: '"الإطار التنسيقي" OR "ائتلاف دولة القانون" OR "ائتلاف الإعمار والتنمية" OR "حركة صادقون"'}
