  - {lang: en, q: 'Iraq "State of Law" OR "Reconstruction and Development Coalition" OR Sadiqoun OR "Asaib Ahl al-Haq" OR Maliki OR Khazali'}
  - {lang: en, q: 'Iraq "Coordination Framework" meeting OR statement OR Sudani OR Hakim OR Amiri OR Sadr'}
  - {lang: ar, q: 'العراق "مجلس النواب" جلسة OR تصويت OR قانون OR "رئاسة البرلمان"'}
  - {lang: ar, q: 'الزيدي يستقبل OR يوجه OR يترأس OR يلتقي OR يؤكد'}
  - {lang: ar, q: '"المكتب الإعلامي لرئيس مجلس الوزراء"'}
  - {lang: ar, q: '"وزارة الإعمار والإسكان" OR "وزير الإعمار والإسكان"'}
  - {lang: ar, q: 'العراق "المدن السكنية" OR "صندوق الإسكان" OR "المبادرة العقارية" OR "أزمة السكن" OR "المجمعات السكنية"'}
  - {lang: en, q: 'Iraq "Ministry of Construction and Housing" OR "housing fund" OR "residential cities" OR "housing crisis" OR "residential complexes"'}
  - {lang: en, q: 'Brent WTI oil prices'}
  - {lang: ko, q: '국제유가 두바이유 OR 브렌트유'}

# GDELT 검색(보조 출처, 기본은 꺼 둠). 키는 필요 없지만 5초당 1회 호출 제한이 있고,
# 시험에서 제한 초과(429)·연결 끊김이 잦아 매번 "일부 출처 실패"가 되므로 기본값에서 뺐다.
# 쓰려면 아래 목록에 검색을 넣는다. 결과는 한·영·아랍어 기사만 받고 시각은 "관측 시각"으로 표시된다.
# 예: gdelt_searches:
#       - {topic: bismayah, q: '(bismayah OR bismaya OR "hanwha")'}
#       - {q: 'iraq (cabinet OR "council of ministers" OR parliament)'}
gdelt_searches: []

topics:
  bismayah:
    label: 비스마야·한화·NIC
    # strong 은 단독으로 주제 일치. context 는 iraq_context 와 함께 있을 때만 일치로 본다.
    strong: [비스마야, bismayah, bismaya, بسماية, "national investment commission", "الهيئة الوطنية للاستثمار", 국가투자위원회, bncp, "이라크 신도시"]
    context: [한화, hanwha, هانوا, nic, 미수금]
  cabinet:
    label: 이라크 내각회의
    # "council of ministers" 는 다른 나라 내각도 가리키므로 이라크 문맥과 함께 있을 때만 일치로 본다.
    strong: ["iraqi cabinet", "iraq cabinet", "iraq's cabinet", "이라크 내각", "مجلس الوزراء العراقي"]
    context: ["council of ministers", "مجلس الوزراء", cabinet, 내각회의, 내각, 각료회의, 총리실, "الجلسة الاعتيادية", "يترأس الجلسة", "يترأس جلسة"]
    # 아랍어로 '총리'는 "رئيس مجلس الوزراء"(내각회의 의장)라서, 총리가 나오는 모든 기사가 내각회의로 잡혔다.
    # 아래 표현은 지우고 나서 일치를 본다(직함·기관 이름일 뿐 내각회의 소식이 아니다).
    ignore: ["رئيس مجلس الوزراء", "لرئيس مجلس الوزراء", "رئاسة مجلس الوزراء", "president of the council of ministers", "head of the council of ministers", "chairman of the council of ministers"]
  korea_media:
    label: 한국 언론
    # 한국어 기사이면서 비스마야·한화 관련일 때만 해당 (코드에서 lang=ko 조건을 건다)
    strong: [비스마야]
    context: [한화]

iraq_context: [이라크, iraq, iraqi, العراق, العراقي, baghdad, 바그다드, بغداد, 비스마야, bismayah, bismaya, بسماية]

# 이라크 매체(이름·주소의 일부). 이라크 매체는 제목에 '이라크'를 쓰지 않는 일이 많으므로,
# 이 매체의 기사는 제목에 이라크가 없어도 이라크 사안으로 본다(정치권·주택 정책 기사가 빠지지 않게).
iraqi_sources: [".iq", shafaq, شفق, "iraqi news agency", واع, "وكالة الأنباء العراقية", almada, المدى, alsumaria, السومرية, baghdadtoday, "بغداد اليوم",
