# 첫 화면(전체 추천)에 보일 사건을 고르는 규칙. 나머지는 화면의 "전체 보기"에서 볼 수 있다.
recommend:
  limit: 20                                   # 첫 화면에 보일 사건 수
  min_score: 20                               # 구역 정원에 넣을 최소 점수
  must_topics: [bismayah, cabinet]            # 제목에서 직접 다룬 기사는 '관심 주제' 구역에 넣는다
  must_cap: {cabinet: 2}                      # 주제별 최대 건수(없으면 전부). 비스마야·한화·NIC 는 제한 없음
  # 구역별 정원. 실제 보고서의 분량 비율을 따랐다. 정원은 limit 을 넘더라도 채운다(그래서 '20건 안팎').
  quota: {정치: 4, 치안: 3, 테러: 2, 경제: 3, 유가: 1, 국제: 4}
  # 화제성: 같은 기간에 여러 매체의 제목에 함께 나온 낱말을 그날의 주요 사안으로 보고 가점한다(app/salience.py).
  #   min_sources 이 낱말을 쓴 매체 수의 하한 / max_bonus 가점 상한 / cap 같은 화제로 추천에 넣을 최대 건수
  burst: {min_sources: 4, max_share: 0.12, max_bonus: 20, cap: 2}
  # 사안별 최소 건수: 구역 정원과 별도로, 아래 사안은 점수순으로 이만큼 먼저 넣는다(보고서 '정치권 동향'의 중심 사안).
  reserve: {parties: 3, pm_action: 2, housing: 2}
  theme_cap: 2                                # 한 구역 안에서 같은 관심 사안은 최대 2건(한 사안이 구역을 독차지하지 않게). floor 형 사안은 제외

