# 관심 주제·검색어·분류·추천 가중치.
# 사용자의 피드백에 따라 이 파일만 고쳐도 검색과 추천이 바뀌도록 단순하게 유지한다.

# 수집 시 실행할 검색. lang 은 Google 뉴스 판(ko/en/ar)을 고른다.
# topic 이 있으면 관심 주제 전용 검색이다(전체 추천에서 밀려도 해당 탭에서 볼 수 있다).
searches:
  - {topic: bismayah, lang: ko, q: '비스마야 OR "비스마야 신도시" OR "한화 이라크"'}
  - {topic: bismayah, lang: en, q: 'Bismayah OR Bismaya OR "Hanwha" Iraq'}
  - {topic: bismayah, lang: en, q: '"National Investment Commission" Iraq'}
  - {topic: bismayah, lang: ar, q: 'بسماية OR هانوا OR "الهيئة الوطنية للاستثمار"'}
  - {topic: cabinet, lang: en, q: 'Iraq "Council of Ministers" OR "Iraqi cabinet"'}
  - {topic: cabinet, lang: ar, q: '"مجلس الوزراء العراقي" OR "جلسة مجلس الوزراء" العراق'}
  - {topic: cabinet, lang: ko, q: '이라크 내각 OR "이라크 총리" OR "이라크 정부"'}
  - {topic: korea_media, lang: ko, q: '비스마야 OR "한화 건설부문" 이라크 OR "한화 이라크"'}
  - {lang: ko, q: '이라크'}
  - {lang: en, q: 'Iraq security OR attack OR drone OR militia'}
  - {lang: en, q: 'Iraq oil OR budget OR economy'}
  - {lang: ar, q: 'العراق أمن OR هجوم OR انفجار'}
  - {lang: en, q: 'Iran "United States" OR Israel OR Hormuz'}
  - {lang: ko, q: '이란 미국 OR 호르무즈 OR 중동 정세'}

# GDELT 검색(보조 출처, 기본은 꺼 둠). 키는 필요 없지만 5초당 1회 호출 제한이 있고,
# 시험에서 제한 초과(429)·연결 끊김이 잦아 매번 "일부 출처 실패"가 되므로 기본값에서 뺐다.
# 쓰려면 아래 목록에 검색을 넣는다. 결과는 한·영·아랍어 기사만 받고 시각은 "관측 시각"으로 표시된다.
# 예: gdelt_searches:
#       - {topic: bismayah, q: '(bismayah OR bismaya OR "hanwha")'}
#       - {q: 'iraq (cabinet OR "council of ministers" OR parliament)'}
gdelt_searches: []

topics:
  bismayah:
    label: 비스마야·한화·NIC
    # strong 은 단독으로 주제 일치. context 는 iraq_context 와 함께 있을 때만 일치로 본다.
    strong: [비스마야, bismayah, bismaya, بسماية, "national investment commission", "الهيئة الوطنية للاستثمار", 국가투자위원회, bncp, "이라크 신도시"]
    context: [한화, hanwha, هانوا, nic, 미수금]
  cabinet:
    label: 이라크 내각회의
    # "council of ministers" 는 다른 나라 내각도 가리키므로 이라크 문맥과 함께 있을 때만 일치로 본다.
    strong: ["iraqi cabinet", "iraq cabinet", "iraq's cabinet", "이라크 내각", "مجلس الوزراء العراقي"]
    context: ["council of ministers", "مجلس الوزراء", cabinet, 내각회의, 내각, 각료회의, 총리실]
  korea_media:
    label: 한국 언론
    # 한국어 기사이면서 비스마야·한화 관련일 때만 해당 (코드에서 lang=ko 조건을 건다)
    strong: [비스마야]
    context: [한화]

iraq_context: [이라크, iraq, iraqi, العراق, العراقي, baghdad, 바그다드, بغداد, 비스마야, bismayah, bismaya, بسماية]

# 분류 키워드. 위에서부터 먼저 일치한 분류를 쓴다. LLM 요약이 있으면 그 분류가 우선한다.
categories:
  테러: [테러, 폭탄, 자폭, ied, 급조폭발물, "suicide bomb", bombing, terror, isis, "islamic state", daesh, 암살, assassinat, إرهاب, داعش, انفجار, عبوة, اغتيال]
  치안: [치안, 공격, 드론, 로켓, 무장단체, 민병대, 시위, 총격, 공습, 납치, attack, drone, rocket, militia, protest, clash, airstrike, kidnap, "security forces", هجوم, مسيرة, فصائل, تظاهرات, أمن, قصف]
  경제: [경제, 신도시, 사업, 수주, 회수, 예산, 유가, 원유, 석유, 가스, 투자, 계약, 미수금, 지급, 환율, 수출, 건설, budget, oil, crude, gas, investment, contract, payment, economy, dinar, export, opec, اقتصاد, موازنة, نفط, استثمار, عقد]
  국제: [미국, 이란, 이스라엘, 사우디, 튀르키예, 시리아, 호르무즈, 제재, 외교, 유엔, "united states", washington, iran, israel, saudi, turkey, syria, hormuz, sanction, diplomat, 美, أمريكا, إيران, إسرائيل]
  정치: [총리, 대통령, 의회, 내각, 정부, 선거, 장관, 법안, 정당, "prime minister", president, parliament, cabinet, government, election, minister, رئيس الوزراء, مجلس الوزراء, مجلس النواب, البرلمان, الحكومة, انتخابات]

regions:
  이라크: [이라크, iraq, العراق, baghdad, 바그다드, بغداد, 쿠르드, kurdistan, erbil, basra, mosul, kirkuk, 비스마야, bismayah, bismaya, بسماية]
  이란: [이란, iran, إيران, tehran, 테헤란]
  이스라엘·팔레스타인: [이스라엘, israel, 가자, gaza, 팔레스타인, palestin, إسرائيل, غزة]
  걸프·사우디: [사우디, saudi, uae, 카타르, qatar, 쿠웨이트, kuwait, 호르무즈, hormuz, 걸프, gulf, 예멘, yemen, 후티, houthi]
  시리아·레바논: [시리아, syria, 레바논, lebanon, 헤즈볼라, hezbollah, سوريا, لبنان]
  튀르키예: [튀르키예, 터키, turkey, türkiye, turkiye]

# 구체적인 결정·시행을 나타내는 표현 (가점). 계획·협의 표현은 가점하지 않는다.
decision_words: [의결, 승인, 체결, 서명, 지급, 완료, 시행, 결정, 발효, 취소, approve, approved, signed, signs, paid, decision, decides, ratif, cancels, cancelled, يوافق, يقر, توقيع, صرف, قرار]

# 공식기관·국영통신 도메인. "그 기관이 발표했다"는 근거일 뿐 내용의 독립 검증을 뜻하지 않는다.
official_domains: [pmo.iq, cabinet.iq, gds.gov.iq, investpromo.gov.iq, nic.gov.iq, ina.iq, mofa.gov.iq, moi.gov.iq]

# 통신사. 같은 통신사 기사를 여러 매체가 재전재한 경우 독립 출처로 세지 않기 위한 표시용.
wire_names: [연합뉴스, 뉴시스, 뉴스1, reuters, afp, "associated press", ap news, ina, "واع"]

# 첫 화면(전체 추천)에 보일 사건을 고르는 규칙. 나머지는 화면의 "전체 보기"에서 볼 수 있다.
recommend:
  limit: 20                                   # 첫 화면에 보일 사건 수
  min_score: 20                               # 분야별 배분에 넣을 최소 점수. 이보다 낮은 기사는 자리가 남을 때만 점수순으로 채운다
  must_topics: [bismayah, cabinet]            # 제목에서 직접 다룬 기사는 항상 포함
  categories: [정치, 치안, 테러, 경제, 국제]   # 남는 자리를 번갈아 채울 분야

weights:
  bismayah_title: 50      # 1순위: 비스마야·한화·NIC 가 제목에서 직접 다뤄짐
  topic_search_hit: 12    # 관심 주제 전용 검색에서 찾았고 이라크 문맥이 있으나 제목에 직접 언급은 없음
  bismayah_mention: 18    # 요약·본문에서만 언급 (단순 언급은 최상위로 올리지 않는다)
  cabinet_title: 35       # 2순위: 이라크 정부·내각회의
  cabinet_mention: 12
  iraq_security: 30       # 3순위: 이라크 내 공격·테러·치안
  iraq_other: 22          # 이라크 정치·경제 일반
  regional_iraq_link: 20  # 4순위: 이라크와 연결된 역내 동향
  regional: 8             # 5순위: 그 밖의 중동 동향
  decision: 10            # 구체적인 결정·시행 표현
  official: 8             # 공식기관·국영통신
  multi_source: 5         # 독립 매체 2곳 이상이 같은 사건 보도
  fresh: 5                # 기간 종료 시점 기준 24시간 이내
